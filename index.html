<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kasir Toko Sembako Barokah</title>
    <style>
      :root {
        --primary: #15803d; /* Hijau Segar */
        --primary-dark: #166534;
        --accent: #ea580c; /* Oranye Tombol Bayar */
        --bg-body: #f1f5f9;
        --bg-card: #ffffff;
        --text-dark: #0f172a;
        --text-muted: #64748b;
        --border: #e2e8f0;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-dark);
        height: 100vh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Header / Topbar */
      header {
        background-color: var(--primary);
        color: #fff;
        padding: 0.85rem 1.5rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        z-index: 10;
      }

      .store-info h1 {
        font-size: 1.25rem;
        font-weight: 700;
      }

      .store-info span {
        font-size: 0.8rem;
        opacity: 0.9;
      }

      .header-actions {
        display: flex;
        gap: 0.75rem;
        align-items: center;
      }

      .btn-top {
        background: rgba(255, 255, 255, 0.18);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.3);
        padding: 0.5rem 0.9rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }

      .btn-top:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      /* Layout Utama PC & Tablet */
      .pos-container {
        display: grid;
        grid-template-columns: 1fr 390px;
        flex: 1;
        overflow: hidden;
      }

      /* Kolom Kiri: Daftar Produk */
      .products-panel {
        padding: 1.25rem;
        display: flex;
        flex-direction: column;
        overflow-y: auto;
      }

      .search-filter-bar {
        display: flex;
        gap: 0.75rem;
        margin-bottom: 1rem;
        flex-wrap: wrap;
      }

      .search-input {
        flex: 1;
        min-width: 220px;
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 10px;
        font-size: 0.95rem;
        outline: none;
      }

      .search-input:focus {
        border-color: var(--primary);
      }

      .category-tabs {
        display: flex;
        gap: 0.5rem;
        margin-bottom: 1.25rem;
        overflow-x: auto;
        padding-bottom: 4px;
      }

      .cat-btn {
        padding: 0.55rem 1.1rem;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: var(--bg-card);
        color: var(--text-dark);
        font-weight: 600;
        font-size: 0.85rem;
        cursor: pointer;
        white-space: nowrap;
      }

      .cat-btn.active {
        background: var(--primary);
        color: #fff;
        border-color: var(--primary);
      }

      /* Grid Barang Sembako */
      .product-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
        gap: 0.9rem;
      }

      .product-card {
        background: var(--bg-card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 1rem;
        cursor: pointer;
        transition:
          transform 0.12s,
          border-color 0.2s;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        user-select: none;
      }

      .product-card:active {
        transform: scale(0.97);
      }

      .product-card:hover {
        border-color: var(--primary);
      }

      .product-emoji {
        font-size: 2rem;
        margin-bottom: 0.5rem;
      }

      .product-name {
        font-weight: 600;
        font-size: 0.95rem;
        margin-bottom: 0.25rem;
        line-height: 1.3;
      }

      .product-unit {
        font-size: 0.78rem;
        color: var(--text-muted);
        margin-bottom: 0.5rem;
      }

      .product-price {
        font-weight: 700;
        color: var(--primary);
        font-size: 1rem;
      }

      /* Kolom Kanan: Keranjang & Pembayaran */
      .cart-panel {
        background: var(--bg-card);
        border-left: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        height: 100%;
        overflow: hidden;
      }

      .cart-header {
        padding: 1rem 1.25rem;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .cart-header h2 {
        font-size: 1.1rem;
      }

      .btn-clear {
        background: #fee2e2;
        color: #dc2626;
        border: none;
        padding: 0.4rem 0.75rem;
        border-radius: 6px;
        font-size: 0.8rem;
        font-weight: 600;
        cursor: pointer;
      }

      .cart-items {
        flex: 1;
        overflow-y: auto;
        padding: 0.75rem 1.25rem;
      }

      .empty-cart {
        text-align: center;
        color: var(--text-muted);
        margin-top: 3rem;
        font-size: 0.9rem;
      }

      .cart-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.75rem 0;
        border-bottom: 1px dashed var(--border);
        gap: 0.5rem;
      }

      .cart-item-info {
        flex: 1;
      }

      .cart-item-title {
        font-weight: 600;
        font-size: 0.9rem;
      }

      .cart-item-sub {
        font-size: 0.8rem;
        color: var(--text-muted);
      }

      .qty-controls {
        display: flex;
        align-items: center;
        gap: 0.4rem;
      }

      .qty-btn {
        width: 30px;
        height: 30px;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #f8fafc;
        font-weight: 700;
        font-size: 1rem;
        cursor: pointer;
      }

      .qty-btn:active {
        background: #e2e8f0;
      }

      .qty-val {
        min-width: 24px;
        text-align: center;
        font-weight: 600;
        font-size: 0.9rem;
      }

      /* Bagian Total & Bayar */
      .checkout-box {
        padding: 1.1rem 1.25rem;
        background: #f8fafc;
        border-top: 1px solid var(--border);
      }

      .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.6rem;
        font-size: 0.95rem;
      }

      .summary-row.total {
        font-size: 1.25rem;
        font-weight: 700;
        color: var(--text-dark);
        padding-top: 0.5rem;
        border-top: 1px solid var(--border);
      }

      .payment-input-group {
        margin: 0.8rem 0;
      }

      .payment-input-group label {
        display: block;
        font-size: 0.82rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
        color: var(--text-muted);
      }

      .cash-input {
        width: 100%;
        padding: 0.65rem 0.9rem;
        font-size: 1.1rem;
        font-weight: 700;
        border: 1.5px solid var(--border);
        border-radius: 8px;
        outline: none;
      }

      .cash-input:focus {
        border-color: var(--primary);
      }

      .quick-cash {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 0.4rem;
        margin-top: 0.5rem;
      }

      .quick-cash button {
        padding: 0.4rem;
        font-size: 0.78rem;
        font-weight: 600;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 6px;
        cursor: pointer;
      }

      .quick-cash button:hover {
        background: #e2e8f0;
      }

      .change-display {
        display: flex;
        justify-content: space-between;
        font-weight: 700;
        font-size: 1rem;
        color: var(--primary);
        margin-bottom: 0.9rem;
      }

      .btn-pay {
        width: 100%;
        padding: 0.9rem;
        background: var(--accent);
        color: #fff;
        border: none;
        border-radius: 10px;
        font-size: 1.05rem;
        font-weight: 700;
        cursor: pointer;
      }

      .btn-pay:hover {
        background: #c2410c;
      }

      /* Modal Struk & Tambah Barang */
      .modal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(15, 23, 42, 0.6);
        z-index: 100;
        justify-content: center;
        align-items: center;
        padding: 1rem;
      }

      .modal-card {
        background: #fff;
        width: 100%;
        max-width: 380px;
        border-radius: 14px;
        padding: 1.5rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.2);
      }

      .receipt-paper {
        font-family: "Courier New", Courier, monospace;
        font-size: 0.88rem;
        border-top: 1px dashed #94a3b8;
        border-bottom: 1px dashed #94a3b8;
        padding: 1rem 0;
        margin: 1rem 0;
      }

      .receipt-line {
        display: flex;
        justify-content: space-between;
        margin-bottom: 0.35rem;
      }

      .form-group {
        margin-bottom: 0.85rem;
      }

      .form-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.3rem;
      }

      .form-group input,
      .form-group select {
        width: 100%;
        padding: 0.6rem;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

      /* Responsif Tablet Portrait (Layar <= 900px) */
      @media (max-width: 900px) {
        body {
          height: auto;
          overflow: auto;
        }
        .pos-container {
          grid-template-columns: 1fr;
          overflow: visible;
        }
        .cart-panel {
          border-left: none;
          border-top: 2px solid var(--border);
        }
        .cart-items {
          max-height: 300px;
        }
      }

      /* Mode Cetak Struk */
      @media print {
        body * {
          visibility: hidden;
        }
        #receipt-modal,
        #receipt-modal * {
          visibility: visible;
        }
        #receipt-modal {
          position: absolute;
          left: 0;
          top: 0;
          background: none;
        }
        .no-print {
          display: none !important;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="store-info">
        <h1>🛒 Toko Sembako Barokah</h1>
        <span id="clock-display">Kasir Utama • Siap Melayani</span>
      </div>
      <div class="header-actions">
        <button class="btn-top" onclick="openAddModal()">+ Barang Baru</button>
      </div>
    </header>

    <div class="pos-container">
      <!-- Panel Kiri: Daftar Barang -->
      <main class="products-panel">
        <div class="search-filter-bar">
          <input
            type="text"
            id="search-box"
            class="search-input"
            placeholder="Cari nama sembako (misal: Beras, Minyak, Telur)..."
            oninput="renderProducts()"
          />
        </div>

        <div class="category-tabs">
          <button class="cat-btn active" onclick="setCategory('Semua', this)">
            Semua
          </button>
          <button class="cat-btn" onclick="setCategory('Bahan Pokok', this)">
            Bahan Pokok
          </button>
          <button class="cat-btn" onclick="setCategory('Minyak & Bumbu', this)">
            Minyak & Bumbu
          </button>
          <button class="cat-btn" onclick="setCategory('Minuman', this)">
            Minuman
          </button>
          <button
            class="cat-btn"
            onclick="setCategory('Kebutuhan Rumah', this)"
          >
            Kebutuhan Rumah
          </button>
        </div>

        <div class="product-grid" id="product-grid"></div>
      </main>

      <!-- Panel Kanan: Keranjang & Kasir -->
      <aside class="cart-panel">
        <div class="cart-header">
          <h2>Keranjang Belanja (<span id="total-qty">0</span>)</h2>
          <button class="btn-clear" onclick="clearCart()">Kosongkan</button>
        </div>

        <div class="cart-items" id="cart-items">
          <div class="empty-cart">
            Ketuk barang di sebelah kiri untuk menambahkan ke transaksi.
          </div>
        </div>

        <div class="checkout-box">
          <div class="summary-row">
            <span>Subtotal</span>
            <span id="subtotal-text">Rp 0</span>
          </div>
          <div class="summary-row total">
            <span>Total Bayar</span>
            <span id="total-text">Rp 0</span>
          </div>

          <div class="payment-input-group">
            <label for="cash-received">Uang Tunai Diterima (Rp)</label>
            <input
              type="number"
              id="cash-received"
              class="cash-input"
              placeholder="0"
              oninput="calculateChange()"
            />
            <div class="quick-cash">
              <button type="button" onclick="setQuickCash('exact')">
                Uang Pas
              </button>
              <button type="button" onclick="setQuickCash(20000)">
                20.000
              </button>
              <button type="button" onclick="setQuickCash(50000)">
                50.000
              </button>
              <button type="button" onclick="setQuickCash(100000)">
                100.000
              </button>
            </div>
          </div>

          <div class="change-display">
            <span>Kembalian:</span>
            <span id="change-text">Rp 0</span>
          </div>

          <button class="btn-pay" onclick="processPayment()">
            PROSES & CETAK STRUK
          </button>
        </div>
      </aside>
    </div>

    <!-- Modal Struk Pembayaran -->
    <div class="modal" id="receipt-modal">
      <div class="modal-card">
        <div style="text-align: center">
          <h3>TOKO SEMBAKO BAROKAH</h3>
          <p style="font-size: 0.8rem; color: #64748b">
            Jl. Pasar Raya No. 12 • Telp: 0812-3456-7890
          </p>
          <p
            id="receipt-time"
            style="font-size: 0.75rem; color: #64748b; margin-top: 4px"
          ></p>
        </div>

        <div class="receipt-paper" id="receipt-body"></div>

        <div style="display: flex; gap: 0.5rem" class="no-print">
          <button
            class="btn-pay"
            style="background: var(--primary)"
            onclick="window.print()"
          >
            🖨️ Cetak Struk
          </button>
          <button
            class="btn-pay"
            style="background: #475569"
            onclick="closeReceipt()"
          >
            Transaksi Baru
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Tambah Barang Baru -->
    <div class="modal" id="add-modal">
      <div class="modal-card">
        <h3 style="margin-bottom: 1rem">Tambah Barang Sembako</h3>
        <div class="form-group">
          <label>Nama Barang</label>
          <input
            type="text"
            id="new-name"
            placeholder="Contoh: Beras Ramos 5kg"
          />
        </div>
        <div class="form-group">
          <label>Kategori</label>
          <select id="new-cat">
            <option value="Bahan Pokok">Bahan Pokok</option>
            <option value="Minyak & Bumbu">Minyak & Bumbu</option>
            <option value="Minuman">Minuman</option>
            <option value="Kebutuhan Rumah">Kebutuhan Rumah</option>
          </select>
        </div>
        <div class="form-group">
          <label>Satuan</label>
          <input
            type="text"
            id="new-unit"
            placeholder="Contoh: 1 Karung / 1 Liter / 1 Kg"
          />
        </div>
        <div class="form-group">
          <label>Harga Jual (Rp)</label>
          <input type="number" id="new-price" placeholder="Contoh: 72000" />
        </div>
        <div style="display: flex; gap: 0.5rem; margin-top: 1rem">
          <button
            class="btn-pay"
            style="background: var(--primary)"
            onclick="saveNewProduct()"
          >
            Simpan Barang
          </button>
          <button
            class="btn-pay"
            style="background: #94a3b8"
            onclick="closeAddModal()"
          >
            Batal
          </button>
        </div>
      </div>
    </div>

    <script>
      // Data Awal Barang Sembako
      let products = JSON.parse(localStorage.getItem("sembako_products")) || [
        {
          id: 1,
          name: "Beras Pandan Wangi",
          unit: "5 Kg",
          price: 75000,
          category: "Bahan Pokok",
          emoji: "🌾",
        },
        {
          id: 2,
          name: "Beras Medium Pulen",
          unit: "1 Kg",
          price: 14000,
          category: "Bahan Pokok",
          emoji: "🍚",
        },
        {
          id: 3,
          name: "Telur Ayam Negeri",
          unit: "1 Kg",
          price: 28000,
          category: "Bahan Pokok",
          emoji: "🥚",
        },
        {
          id: 4,
          name: "Gula Pasir Putih",
          unit: "1 Kg",
          price: 17500,
          category: "Bahan Pokok",
          emoji: "🧂",
        },
        {
          id: 5,
          name: "Tepung Terigu Segitiga",
          unit: "1 Kg",
          price: 13000,
          category: "Bahan Pokok",
          emoji: "🥟",
        },
        {
          id: 6,
          name: "Minyak Goreng Kita",
          unit: "1 Liter",
          price: 16500,
          category: "Minyak & Bumbu",
          emoji: "🫗",
        },
        {
          id: 7,
          name: "Minyak Goreng Bimoli",
          unit: "2 Liter",
          price: 36000,
          category: "Minyak & Bumbu",
          emoji: "🧴",
        },
        {
          id: 8,
          name: "Kecap Manis Bango",
          unit: "520 ml",
          price: 23000,
          category: "Minyak & Bumbu",
          emoji: "🍾",
        },
        {
          id: 9,
          name: "Garam Dapur Beryodium",
          unit: "250 gr",
          price: 4000,
          category: "Minyak & Bumbu",
          emoji: "🧂",
        },
        {
          id: 10,
          name: "Indomie Goreng",
          unit: "1 Bungkus",
          price: 3500,
          category: "Bahan Pokok",
          emoji: "🍜",
        },
        {
          id: 11,
          name: "Kopi Kapal Api Mix",
          unit: "1 Renteng",
          price: 15000,
          category: "Minuman",
          emoji: "☕",
        },
        {
          id: 12,
          name: "Teh Celup SariWangi",
          unit: "1 Kotak",
          price: 7500,
          category: "Minuman",
          emoji: "🫖",
        },
        {
          id: 13,
          name: "Galon Air Mineral",
          unit: "19 Liter",
          price: 21000,
          category: "Minuman",
          emoji: "💧",
        },
        {
          id: 14,
          name: "Sabun Cuci Piring",
          unit: "750 ml",
          price: 14500,
          category: "Kebutuhan Rumah",
          emoji: "🫧",
        },
        {
          id: 15,
          name: "Deterjen Bubuk",
          unit: "800 gr",
          price: 18000,
          category: "Kebutuhan Rumah",
          emoji: "🧺",
        },
        {
          id: 16,
          name: "Gas Elpiji",
          unit: "Tabung 3 Kg",
          price: 22000,
          category: "Kebutuhan Rumah",
          emoji: "🔥",
        },
      ];

      let cart = [];
      let activeCategory = "Semua";

      function formatRupiah(angka) {
        return "Rp " + angka.toLocaleString("id-ID");
      }

      // Update Jam Real-Time
      setInterval(() => {
        const now = new Date();
        document.getElementById("clock-display").textContent =
          now.toLocaleDateString("id-ID", {
            weekday: "long",
            day: "numeric",
            month: "short",
            year: "numeric",
          }) +
          " • " +
          now.toLocaleTimeString("id-ID");
      }, 1000);

      // Render Daftar Produk
      function renderProducts() {
        const keyword = document
          .getElementById("search-box")
          .value.toLowerCase();
        const grid = document.getElementById("product-grid");

        const filtered = products.filter((p) => {
          const matchCat =
            activeCategory === "Semua" || p.category === activeCategory;
          const matchSearch = p.name.toLowerCase().includes(keyword);
          return matchCat && matchSearch;
        });

        grid.innerHTML = filtered
          .map(
            (p) => `
                <div class="product-card" onclick="addToCart(${p.id})">
                    <div>
                        <div class="product-emoji">${p.emoji}</div>
                        <div class="product-name">${p.name}</div>
                        <div class="product-unit">${p.unit}</div>
                    </div>
                    <div class="product-price">${formatRupiah(p.price)}</div>
                </div>
            `,
          )
          .join("");
      }

      function setCategory(cat, btn) {
        activeCategory = cat;
        document
          .querySelectorAll(".cat-btn")
          .forEach((b) => b.classList.remove("active"));
        btn.classList.add("active");
        renderProducts();
      }

      // Logika Keranjang
      function addToCart(id) {
        const product = products.find((p) => p.id === id);
        const existing = cart.find((item) => item.id === id);

        if (existing) {
          existing.qty += 1;
        } else {
          cart.push({ ...product, qty: 1 });
        }
        renderCart();
      }

      function updateQty(id, delta) {
        const index = cart.findIndex((item) => item.id === id);
        if (index === -1) return;

        cart[index].qty += delta;
        if (cart[index].qty <= 0) {
          cart.splice(index, 1);
        }
        renderCart();
      }

      function clearCart() {
        cart = [];
        document.getElementById("cash-received").value = "";
        renderCart();
      }

      function getTotal() {
        return cart.reduce((sum, item) => sum + item.price * item.qty, 0);
      }

      function renderCart() {
        const container = document.getElementById("cart-items");
        const totalQtyEl = document.getElementById("total-qty");
        const subtotalEl = document.getElementById("subtotal-text");
        const totalEl = document.getElementById("total-text");

        const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
        const totalAmount = getTotal();

        totalQtyEl.textContent = totalQty;
        subtotalEl.textContent = formatRupiah(totalAmount);
        totalEl.textContent = formatRupiah(totalAmount);

        if (cart.length === 0) {
          container.innerHTML =
            '<div class="empty-cart">Ketuk barang di sebelah kiri untuk menambahkan ke transaksi.</div>';
        } else {
          container.innerHTML = cart
            .map(
              (item) => `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-title">${item.name}</div>
                            <div class="cart-item-sub">${formatRupiah(item.price)} / ${item.unit}</div>
                        </div>
                        <div class="qty-controls">
                            <button class="qty-btn" onclick="updateQty(${item.id}, -1)">-</button>
                            <span class="qty-val">${item.qty}</span>
                            <button class="qty-btn" onclick="updateQty(${item.id}, 1)">+</button>
                        </div>
                    </div>
                `,
            )
            .join("");
        }
        calculateChange();
      }

      // Hitung Kembalian
      function setQuickCash(val) {
        const total = getTotal();
        document.getElementById("cash-received").value =
          val === "exact" ? total : val;
        calculateChange();
      }

      function calculateChange() {
        const total = getTotal();
        const cash =
          parseInt(document.getElementById("cash-received").value) || 0;
        const change = cash - total;
        const changeEl = document.getElementById("change-text");

        if (cash === 0) {
          changeEl.textContent = "Rp 0";
          changeEl.style.color = "var(--primary)";
        } else if (change < 0) {
          changeEl.textContent = "Kurang " + formatRupiah(Math.abs(change));
          changeEl.style.color = "#DC2626";
        } else {
          changeEl.textContent = formatRupiah(change);
          changeEl.style.color = "var(--primary)";
        }
      }

      // Proses Bayar & Tampilkan Struk
      function processPayment() {
        const total = getTotal();
        if (cart.length === 0) {
          alert("Keranjang belanja masih kosong!");
          return;
        }

        const cash =
          parseInt(document.getElementById("cash-received").value) || 0;
        if (cash < total) {
          alert("Nominal uang tunai masih kurang dari total belanja!");
          return;
        }

        const change = cash - total;
        const now = new Date();
        document.getElementById("receipt-time").textContent =
          now.toLocaleString("id-ID");

        let itemsHtml = cart
          .map(
            (item) => `
                <div class="receipt-line">
                    <span>${item.name} (${item.qty}x)</span>
                    <span>${(item.price * item.qty).toLocaleString("id-ID")}</span>
                </div>
            `,
          )
          .join("");

        itemsHtml += `
                <div style="border-top: 1px dashed #94A3B8; margin: 8px 0;"></div>
                <div class="receipt-line"><strong>TOTAL</strong><strong>${formatRupiah(total)}</strong></div>
                <div class="receipt-line"><span>TUNAI</span><span>${formatRupiah(cash)}</span></div>
                <div class="receipt-line"><span>KEMBALIAN</span><span>${formatRupiah(change)}</span></div>
            `;

        document.getElementById("receipt-body").innerHTML = itemsHtml;
        document.getElementById("receipt-modal").style.display = "flex";
      }

      function closeReceipt() {
        document.getElementById("receipt-modal").style.display = "none";
        clearCart();
      }

      // Tambah Produk Baru (Tersimpan di Browser/LocalStorage)
      function openAddModal() {
        document.getElementById("add-modal").style.display = "flex";
      }

      function closeAddModal() {
        document.getElementById("add-modal").style.display = "none";
      }

      function saveNewProduct() {
        const name = document.getElementById("new-name").value.trim();
        const category = document.getElementById("new-cat").value;
        const unit =
          document.getElementById("new-unit").value.trim() || "1 Pcs";
        const price = parseInt(document.getElementById("new-price").value);

        if (!name || !price || price <= 0) {
          alert("Lengkapi nama barang dan harga dengan benar.");
          return;
        }

        products.unshift({
          id: Date.now(),
          name,
          category,
          unit,
          price,
          emoji: "📦",
        });

        localStorage.setItem("sembako_products", JSON.stringify(products));
        renderProducts();
        closeAddModal();

        document.getElementById("new-name").value = "";
        document.getElementById("new-unit").value = "";
        document.getElementById("new-price").value = "";
      }

      // Inisialisasi Awal
      renderProducts();
    </script>
  </body>
</html>
